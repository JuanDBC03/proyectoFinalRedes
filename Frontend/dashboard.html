<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Universidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="topbar">
        <div class="logo">
            <svg viewBox="0 0 64 64" width="20" height="20"><path fill="#ffffff" d="M46.7,21.5c-0.8-8.7-8.1-15.5-17.1-15.5c-7.3,0-13.6,4.5-16.1,11c-0.5-0.1-1-0.1-1.5-0.1C5.4,16.9,0,22.3,0,28.9 c0,6.6,5.4,12,12,12h34.6c9.6,0,17.4-7.8,17.4-17.4C64,24.8,56.3,21.5,46.7,21.5z"></path></svg>
            Universidad Autónoma
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" oninput="filtrarContenido()" placeholder="Buscar eventos, usuarios o instalaciones...">
        </div>
        <div class="user-profile">
            <span id="userEmail">Cargando...</span>
            <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="dinamicSidebar"></aside>

        <main class="content-area OD3Scrollbar">
            
            <div class="content-header" id="dinamicHeader">
                <h1>Panel de Control</h1>
                <button id="btn-crear-evento" class="btn-primary" style="display: none;">
                    <i class="fas fa-plus"></i> Nuevo Evento
                </button>
            </div>

            <h2 style="font-size: var(--fontSizeBase400); margin: 0 0 20px 0; color: var(--ms-palette-neutralPrimary);">Todos los registros</h2>
            <div class="events-grid" id="gridEventos">
                <p style="color: var(--ms-palette-neutralSecondary);">Cargando interfaz...</p>
            </div>

        </main>
    </div>

    <div id="modalCrearUsuario" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>➕ Crear Nuevo Usuario</h2>
            <input type="number" id="nuevoId" placeholder="ID (Cédula o Código Estudiantil)">
            <input type="text" id="nuevoNombre" placeholder="Nombres">
            <input type="text" id="nuevoApellidos" placeholder="Apellidos">
            <input type="email" id="nuevoEmail" placeholder="Correo electrónico">
            <input type="text" id="nuevoTelefono" placeholder="Teléfono de contacto">
            <input type="password" id="nuevaPassword" placeholder="Contraseña temporal">
            
            <select id="nuevoRol" onchange="cambiarFormularioRol()">
                <option value="">Seleccione un rol...</option>
                <option value="estudiante">Estudiante</option>
                <option value="docente">Docente</option>
                <option value="secretariaAcademica">Secretaría Académica</option>
            </select>

            <div id="divEntidadAcademica" style="display: none; margin-bottom: 10px;">
                <label id="labelEntidad" style="font-size: 13px; color: var(--ms-palette-neutralSecondary); display: block; margin-bottom: 5px;"></label>
                <select id="nuevaEntidadId">
                    <option value="">Esperando rol...</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalUsuario()">Cancelar</button>
                <button class="btn-primary" style="background-color:#107c10;" onclick="guardarUsuarioBD()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalEditarUsuario" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>✏️ Editar Perfil de Usuario</h2>
            <input type="hidden" id="editarUsuarioId">
            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block;">Nombres:</label>
                <input type="text" id="editarNombre" placeholder="Nombres">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block;">Apellidos:</label>
                <input type="text" id="editarApellidos" placeholder="Apellidos">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block;">Teléfono de contacto:</label>
                <input type="text" id="editarTelefono" placeholder="Teléfono de contacto">
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalEditarUsuario()">Cancelar</button>
                <button class="btn-primary" style="background-color:var(--ms-palette-themePrimary);" onclick="guardarEdicionUsuarioBD()">Actualizar</button>
            </div>
        </div>
    </div>

    <div id="modalInstalacion" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="tituloModalInstalacion">🏢 Gestión de Instalación</h2>
            
            <input type="hidden" id="instIdOculto">
            
            <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block; margin-bottom: 5px;">ID / Código de la instalación:</label>
            <input type="text" id="instIdVisible" placeholder="Ej: CANCHA-1, SALON-204, AUDITORIO-A">

            <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block; margin-bottom: 5px; margin-top: 10px;">Tipo de Instalación:</label>
            <select id="instTipo">
                <option value="salon">Salón</option>
                <option value="auditorio">Auditorio</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="cancha">Cancha</option>
            </select>

            <input type="number" id="instCapacidad" placeholder="Capacidad máxima" style="margin-top: 10px;">
            <input type="text" id="instUbicacion" placeholder="Bloque / Piso / Salón (Ej: Edificio A - Piso 1)">
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalInstalacion()">Cancelar</button>
                <button class="btn-primary" style="background-color:#107c10;" onclick="guardarInstalacionBD()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalEvento" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="tituloModalEvento">➕ Crear Nuevo Evento</h2>
            
            <input type="hidden" id="eventoIdOculto"> 
            <input type="text" id="eventoNombre" placeholder="Nombre del evento">
            
            <select id="eventoTipo">
                <option value="academico">Académico</option>
                <option value="ludico">Lúdico</option>
            </select>

            <input type="number" id="eventoCupos" placeholder="Cupos máximos de asistencia">
            <input type="date" id="eventoFecha">
            <input type="time" id="eventoHoraInicio" placeholder="Hora de Inicio">
            <input type="time" id="eventoHoraFin" placeholder="Hora de Finalización">
            
            <select id="eventoUbicacion">
                <option value="">Cargando instalaciones...</option>
            </select>

            <select id="eventoTipoAval">
                <option value="directorPrograma">Aval por Director de Programa</option>
                <option value="directorDocencia">Aval por Director de Docencia</option>
            </select>

            <select id="eventoOrganizacion">
                <option value="">Cargando organizaciones externas...</option>
            </select>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalEvento()">Cancelar</button>
                <button class="btn-primary" style="background-color:#107c10;" onclick="guardarEventoBD()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modalParticipantes" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <h2>👥 Participantes del Evento</h2>
            <div id="listaParticipantes" style="margin: 15px 0; max-height: 300px; overflow-y: auto;">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalParticipantes()">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="modalEvaluacionEvento" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="tituloModalEvaluacion">📝 Dictamen Académico de Evento</h2>
            <input type="hidden" id="evaluacionEventoId">
            <input type="hidden" id="evaluacionEstado">
            
            <div id="divActa" style="display: none; margin-bottom: 15px;">
                <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block; margin-bottom: 5px;">📄 Nombre del Acta de Aprobación (PDF):</label>
                <input type="text" id="evaluacionActa" placeholder="Ej: resolucion_aprobacion.pdf" style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div id="divJustificacion" style="display: none; margin-bottom: 15px;">
                <label style="font-size: 12px; color: var(--ms-palette-neutralSecondary); display:block; margin-bottom: 5px;">✍️ Justificación Técnica / Académica del Rechazo:</label>
                <textarea id="evaluacionJustificacion" placeholder="Escriba el motivo técnico o legal para devolver el evento..." style="width: 100%; height: 100px; border: 1px solid var(--ms-palette-neutralLight); padding: 8px; font-family: inherit; resize: none; box-sizing: border-box;"></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cerrarModalCrearEvaluacion()">Cancelar</button>
                <button class="btn-primary" style="background-color:#5c2d91;" onclick="guardarEvaluacionBD()">Asentar Evaluación</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="modalConfirmacion" class="modal-overlay" style="display: none; z-index: 10000;">
        <div class="modal-content" style="width: 350px; text-align: center; gap: 8px;">
            <div style="font-size: 40px; color: #d13438; margin-bottom: 8px;"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 style="margin: 0; font-size: 20px;">¿Estás seguro?</h2>
            <p id="textoConfirmacion" style="color: var(--ms-palette-neutralSecondary); font-size: var(--fontSizeBase300); margin-bottom: 16px;"></p>
            
            <div class="modal-actions" style="justify-content: center; width: 100%;">
                <button class="btn-cancel" onclick="cerrarConfirmacion()">Cancelar</button>
                <button class="btn-primary" id="btnConfirmarAccion" style="background-color: #d13438;">Sí, proceder</button>
            </div>
        </div>
    </div>

    <script src="js/usuarios.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/instalaciones.js"></script> 
    <script src="js/core.js"></script>
    <script src="js/evaluaciones.js"></script>
    <script src="js/inscripciones.js"></script>
    <script src="js/notificaciones.js"></script>
    <script src="js/api.js"></script>
    <script src="js/analytics.js"></script>
    
</body>
</html>
