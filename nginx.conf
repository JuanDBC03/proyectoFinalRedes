worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 1. SERVIR EL FRONTEND
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html; 
        }

        # 2. API GATEWAY (Rutas a Microservicios)
        location /api/v1/auth/ {
            proxy_pass http://auth_service:8001/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/usuarios/ {
            proxy_pass http://usuarios_service:8002/api/v1/usuarios/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/eventos/ {
            proxy_pass http://eventos_service:8003/api/v1/eventos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/evaluaciones/ {
            proxy_pass http://evaluaciones_service:8004/api/v1/evaluaciones/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/instalaciones/ {
            proxy_pass http://instalaciones_service:8005/api/v1/instalaciones/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/notificaciones/ {
            proxy_pass http://notificaciones_service:8006/api/v1/notificaciones/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/analytics/ {
            proxy_pass http://analytics_service:8007/api/v1/analytics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}